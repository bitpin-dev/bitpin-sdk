[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bitpin-sdk"
version = "0.1.0"
description = "Official Python SDK for the Bitpin exchange API (REST + WebSocket, sync + async)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bitpin" }]
keywords = ["bitpin", "crypto", "exchange", "trading", "sdk", "ccxt", "market-making"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ws = ["centrifuge-python>=0.4,<1"]

[project.urls]
Homepage = "https://github.com/bitpin-dev/bitpin-sdk"
Documentation = "https://bitpin-dev.github.io/bitpin-sdk/"
Source = "https://github.com/bitpin-dev/bitpin-sdk/tree/main/python"
Changelog = "https://github.com/bitpin-dev/bitpin-sdk/blob/main/python/CHANGELOG.md"
Issues = "https://github.com/bitpin-dev/bitpin-sdk/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "hypothesis>=6.100",
  "jsonschema>=4.22",
  "pyyaml>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "unasync>=0.6",
  "centrifuge-python>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bitpin_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["live: calls the real Bitpin API (read-only); never run in CI"]
addopts = "-m 'not live'"

[tool.coverage.run]
branch = true
source = ["bitpin_sdk"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/bitpin_sdk/_generated", "src/bitpin_sdk/_sync"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "PT", "C4", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["tomli", "centrifuge", "centrifuge.*", "respx"]
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
exclude = [".hypothesis", ".venv", "dist"]
