name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check src tests ../examples
      - run: uv run ruff format --check src tests ../examples
      - run: uv run mypy src ../examples/python

  generated:
    name: Spec and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python ../scripts/check_spec.py
      - run: uv run python ../scripts/gen_python.py --check
      - run: uv run python ../scripts/gen_sync.py --check
      - run: uv run python ../scripts/gen_llms_full.py --check
      - run: uv run python ../scripts/gen_ts.py --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
      - run: uv run python ../scripts/gen_go.py --check

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Build the package
        run: uv build
      - name: Install the wheel in a clean environment
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/python -c "import bitpin_sdk; print(bitpin_sdk.__version__)"

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npx biome ci . ../examples/ts
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - run: npm run build
      - name: Pack and import the package in a clean project
        run: |
          npm pack
          mkdir /tmp/clean && cd /tmp/clean && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/ts/bitpin-sdk-*.tgz
          node --input-type=module -e "import { Bitpin, VERSION } from 'bitpin-sdk'; console.log(VERSION, typeof new Bitpin().fetchTicker)"
          node -e "const { Bitpin } = require('bitpin-sdk'); console.log(typeof Bitpin)"

  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    defaults:
      run:
        working-directory: go
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage at least 90 %
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "coverage: $total%"
          awk -v t="$total" 'BEGIN { exit (t < 90) }'

  docs:
    name: Docs (en + fa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python ../scripts/check_docs.py
      - run: uvx --with-requirements ../docs/requirements.txt mkdocs build --strict -f ../mkdocs.yml

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
